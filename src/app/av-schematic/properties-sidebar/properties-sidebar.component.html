<aside class="sidebar" aria-labelledby="properties-sidebar-title">
  <app-sidebar-header
    title="Properties"
    titleId="properties-sidebar-title"
    iconClass="icon-sidebar"
    ariaLabel="Toggle properties panel"
    [isExpanded]="isExpanded()"
    (toggle)="onHeaderToggle()"
  />
  @if (isExpanded()) {
    <div class="sidebar-separator"></div>
    <div class="sidebar-content sidebar-enter">
      @if (state() === 'single-node' && selectedNode(); as node) {
        <app-device-form [entityId]="node.id" [nodeData]="node.data" />
        <div class="sidebar-actions">
          <button class="remove-button p10" type="button" (click)="onRemoveNode()">
            Remove device
          </button>
        </div>
      } @else if (state() === 'single-edge' && selectedWireDetails(); as wire) {
        <app-wire-form
          [edgeId]="wire.edge.id"
          [edgeData]="wire.edge.data"
          [source]="wire.source"
          [target]="wire.target"
        />
        <div class="sidebar-actions">
          @if (wire.edge.routingMode === 'manual') {
            <button class="action-button p10" type="button" (click)="onResetWireRouting()">
              Reset routing
            </button>
          }
          <button class="remove-button p10" type="button" (click)="onRemoveWire()">
            Remove wire
          </button>
        </div>
      } @else if (state() === 'empty') {
        <app-sidebar-placeholder
          title="No selection"
          description="Select a device or wire on the canvas to view its properties."
        />
      } @else {
        <app-sidebar-placeholder
          title="Multiple items selected."
          description="Please select a single device or wire to view properties."
        />
      }
    </div>
  }
</aside>

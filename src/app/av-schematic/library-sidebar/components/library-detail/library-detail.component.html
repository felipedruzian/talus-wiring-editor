@if (device(); as d) {
  <div class="detail-toolbar">
    <button class="back-button p10" type="button" (click)="onBack()" aria-label="Back to library">
      <span aria-hidden="true">&larr;</span>
      <span>Back to library</span>
    </button>
  </div>

  <div class="detail-form">
    <app-device-form [nodeId]="libraryId()" [nodeData]="d.template" />
  </div>

  <div class="detail-actions">
    <button class="remove-button p10" type="button" (click)="onRemove()">
      Remove from library
    </button>
  </div>
}

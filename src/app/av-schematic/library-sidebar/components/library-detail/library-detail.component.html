<div class="detail-toolbar">
  <span class="detail-title h10">{{ title() }}</span>
  <button class="close-button" type="button" (click)="onBack()" aria-label="Close">
    <span class="icon icon-close" aria-hidden="true"></span>
  </button>
</div>

<div class="detail-form">
  <app-device-form [entityId]="libraryId()" [nodeData]="initialTemplate()" />
</div>

<div class="detail-actions">
  <button class="save-button p10" type="button" (click)="onSave()" [disabled]="!canSave()">
    Save
  </button>
  @if (mode() === 'edit') {
    <button class="remove-button p10" type="button" (click)="onRemove()">
      Remove from library
    </button>
  }
</div>

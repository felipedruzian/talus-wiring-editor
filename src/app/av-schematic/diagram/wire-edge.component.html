<ng-diagram-base-edge
  [edge]="edge()"
  [stroke]="strokeColor()"
  [strokeWidth]="strokeWidth()"
>
  <ng-diagram-base-edge-label id="wire-id-source" [positionOnEdge]="'30px'">
    <span class="wire-label">{{ edge().data.wireId }}</span>
  </ng-diagram-base-edge-label>
  <ng-diagram-base-edge-label id="wire-id-target" [positionOnEdge]="'-30px'">
    <span class="wire-label">{{ edge().data.wireId }}</span>
  </ng-diagram-base-edge-label>
</ng-diagram-base-edge>

<div class="board-node">
  <span class="board-node__label">{{ data().label }}</span>
  <svg
    class="board-node__grid"
    [attr.width]="size().width"
    [attr.height]="size().height"
    [attr.viewBox]="'0 0 ' + size().width + ' ' + size().height"
  >
    @for (hole of holes(); track hole.row + '-' + hole.col) {
      <circle class="board-node__hole" [attr.cx]="hole.x" [attr.cy]="hole.y" r="2.5" />
    }
  </svg>
</div>

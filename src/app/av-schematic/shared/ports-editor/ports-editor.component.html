<div class="tabs">
  <button
    type="button"
    class="tab p10"
    [class.is-active]="activeDirection() === 'input'"
    [attr.aria-pressed]="activeDirection() === 'input'"
    (click)="setActiveDirection('input')"
  >
    Inputs ({{ inputs().length }})
  </button>
  <button
    type="button"
    class="tab p10"
    [class.is-active]="activeDirection() === 'output'"
    [attr.aria-pressed]="activeDirection() === 'output'"
    (click)="setActiveDirection('output')"
  >
    Outputs ({{ outputs().length }})
  </button>
</div>

<div class="port-list">
  @for (port of visiblePorts(); track port.id) {
    <div class="port-row">
      <div class="reorder">
        <button
          type="button"
          class="icon-button"
          aria-label="Move up"
          [disabled]="isFirstInDirection(port)"
          (click)="moveUp(port.id)"
        >
          <span class="icon icon-caret-up" aria-hidden="true"></span>
        </button>
        <button
          type="button"
          class="icon-button"
          aria-label="Move down"
          [disabled]="isLastInDirection(port)"
          (click)="moveDown(port.id)"
        >
          <span class="icon icon-caret-down" aria-hidden="true"></span>
        </button>
      </div>

      <input
        type="text"
        class="port-input port-label p10"
        placeholder="Label"
        [value]="port.label"
        [appAutofocus]="autofocusPortId() === port.id"
        (input)="updateLabel(port.id, $any($event.target).value)"
      />
      <select
        class="port-input port-connector p10"
        (change)="updateConnectorType(port.id, $any($event.target).value)"
      >
        <option value="" [selected]="!port.connectorType">—</option>
        @for (connector of connectorTypes; track connector) {
          <option [value]="connector" [selected]="connector === port.connectorType">
            {{ connector }}
          </option>
        }
      </select>

      <button
        type="button"
        class="icon-action"
        aria-label="Switch direction"
        (click)="toggleDirection(port.id)"
      >
        <span class="icon icon-swap" aria-hidden="true"></span>
      </button>
      <button
        type="button"
        class="icon-action danger"
        aria-label="Remove port"
        (click)="removePort(port.id)"
      >
        <span class="icon icon-trash" aria-hidden="true"></span>
      </button>
    </div>
  }
</div>

<button type="button" class="add-port-button p10" (click)="addPort()">
  <span class="icon icon-plus-circle" aria-hidden="true"></span>
  Add new port
</button>

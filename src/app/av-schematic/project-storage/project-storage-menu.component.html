@let busy = isBusy();
@let currentStatus = status();
<div class="project-storage">
  <label class="id-label" for="project-storage-id">ID do projeto</label>
  <input
    id="project-storage-id"
    class="id-input"
    type="text"
    autocomplete="off"
    spellcheck="false"
    [value]="projectId()"
    [disabled]="busy"
    (input)="onProjectIdInput($event)"
  />

  <button type="button" class="action-btn" [disabled]="busy" (click)="save()">
    {{ busy && operationIsSave() ? 'Salvando...' : 'Salvar' }}
  </button>
  <button type="button" class="action-btn" [disabled]="busy" (click)="open()">
    {{ busy && !operationIsSave() ? 'Abrindo...' : 'Abrir' }}
  </button>

  @if (message(); as text) {
    <span
      class="status-message"
      [class.is-error]="currentStatus === 'error'"
      [attr.role]="statusRole()"
    >
      {{ text }}
    </span>
  }
</div>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      const stored = localStorage.getItem('theme');
      const preferred = window.matchMedia('(prefers-color-scheme: light)').matches
        ? 'light'
        : 'dark';
      document.documentElement.dataset.theme = stored || preferred;
    </script>
    <!-- The contact-form widget <script> tag is injected at deploy time from the
         HUBSPOT_PORTAL_ID / HUBSPOT_FORM_ID Actions variables (see deploy-to-azure.yml). -->
    <title>AV Schematic Software - Interactive Demo | ngDiagram</title>
    <meta
      name="description"
      content="Build interactive AV schematics in the browser. Drag devices, wire ports, export to DXF or PNG. A live audio visual system design demo by ngDiagram."
    />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
